name: gp_hudai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.2+1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  flutter_phone_direct_caller: ^2.2.1
  wakelock_plus: ^1.4.0
  audioplayers: ^6.1.0
  image: ^4.0.17
  tflite_flutter: ^0.11.0
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/audio/camera/
    - assets/audio/location/
    - assets/audio/setup/
    - assets/audio/onboarding/
    - assets/images/
    - assets/models/
