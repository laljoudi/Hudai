name: gp_hudai
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.2+1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2
  flutter_phone_direct_caller: ^2.2.1
  wakelock_plus: ^1.4.0
  audioplayers: ^6.1.0
  image: ^4.0.17
  tflite_flutter: ^0.11.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.14.4"
  google_fonts: "6.2.1"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/ic_launcher_foreground.png"
  image_path_ios: "assets/icon/play_store_512.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#030A20"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  adaptive_icon_padding: false
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/audio/camera/
    - assets/audio/location/
    - assets/audio/setup/
    - assets/audio/onboarding/
    - assets/audio/settings/
    - assets/audio/detection/
    - assets/audio/detection/safety/
    - assets/audio/detection/camera_guidance/
    - assets/audio/detection/mountain_recognition_status/
    - assets/audio/detection/mountain_location/
    - assets/audio/detection/movement_confirmation/
    - assets/audio/detection/distance_and_arrival/
    - assets/audio/detection/other_audio/
    - assets/images/
    - assets/models/
    - assets/test_images/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

